<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>PIN 登录 · 星芽学园</title>
<link rel="stylesheet" href="../../_shared/child.css"/>
</head>
<body class="child">
<p class="gallery-note">头像墙选中后 · <a href="../index.html">返回图集</a> · <a href="wall.html">头像墙</a></p>
<div class="frame">
<header class="top" style="grid-template-columns:1fr auto">
  <p class="brand"><span class="logo">芽</span><span>星芽学园</span></p>
  <button class="btn-line" type="button" style="min-height:44px">家长入口</button>
</header>
<main>
<section class="card pin-wrap">
  <div style="text-align:center">
    <div style="width:120px;height:120px;margin:0 auto 8px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 4px #C08A2E;display:grid;place-items:center;font-size:48px">🧒</div>
    <h1 style="margin:0">小米</h1>
    <p class="muted">请输入 4 位 PIN</p>
    <div class="dots" aria-hidden="true"><span class="on"></span><span class="on"></span><span></span><span></span></div>
  </div>
  <div>
    <div class="keys" role="group" aria-label="数字键盘">
      <button type="button">1</button><button type="button">2</button><button type="button">3</button>
      <button type="button">4</button><button type="button">5</button><button type="button">6</button>
      <button type="button">7</button><button type="button">8</button><button type="button">9</button>
      <button type="button" aria-label="清空">⌫</button><button type="button">0</button><button type="button" aria-label="退格">←</button>
    </div>
  </div>
</section>
</main>
</div>
</body></html>
