<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>头像墙 · 星芽学园</title>
<link rel="stylesheet" href="../../_shared/child.css"/>
</head>
<body class="child">
<p class="gallery-note"><a href="../index.html">返回图集</a></p>
<div class="frame">
<header class="top" style="grid-template-columns:1fr auto">
  <p class="brand"><span class="logo">芽</span><span>星芽学园</span></p>
  <button class="btn-line" type="button" style="min-height:44px">家长入口</button>
</header>
<main>
<section class="card" style="max-width:860px;margin:32px auto;padding:32px;text-align:center">
  <h1 style="margin:0;font-size:32px">谁来学习？</h1>
  <p class="muted">点一点自己的头像</p>
  <div style="display:flex;justify-content:center;gap:24px;flex-wrap:wrap;margin-top:20px">
    <a href="pin.html" style="width:180px;padding:16px;border-radius:26px;border:2px solid var(--line);background:var(--paper);text-decoration:none;color:inherit;box-shadow:0 5px 0 var(--line)">
      <div style="width:100px;height:100px;margin:0 auto;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:40px">🧒</div>
      <b style="font-size:22px">小米</b><div class="muted">★ 128</div>
    </a>
    <button type="button" style="width:180px;padding:16px;border-radius:26px;border:2px solid var(--line);background:var(--paper);box-shadow:0 5px 0 var(--line)">
      <div style="width:100px;height:100px;margin:0 auto;border-radius:50%;background:var(--gold);display:grid;place-items:center;font-size:40px">👧</div>
      <b style="font-size:22px">豆豆</b><div class="muted">★ 40</div>
    </button>
    <button type="button" disabled style="width:180px;padding:16px;border-radius:26px;border:2px solid var(--line);background:#EEF1EF;opacity:.85">
      <div style="width:100px;height:100px;margin:0 auto;border-radius:50%;background:var(--stone);display:grid;place-items:center;font-size:40px;filter:grayscale(.6)">🧒</div>
      <b style="font-size:22px">阿宝</b><div class="muted">锁住了</div>
    </button>
  </div>
</section>
</main>
</div>
</body></html>
